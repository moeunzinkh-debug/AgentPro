# Automatically deploys Agent Pro to Cloudflare Workers on every push to main.
#
# One-time setup (repo owner):
#   1. Create an API token: https://dash.cloudflare.com/profile/api-tokens
#      -> "Edit Cloudflare Workers" template.
#   2. Add it as a repository secret:
#      Settings -> Secrets and variables -> Actions -> New repository secret
#         Name:  CLOUDFLARE_API_TOKEN
#   3. (Optional) Add CLOUDFLARE_ACCOUNT_ID if your token can access more
#      than one account, to pin the deploy target.
#
# Until the secret exists this workflow fails fast with a clear message
# instead of half-deploying.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::Secret CLOUDFLARE_API_TOKEN is not set."
          echo "Add it under Settings -> Secrets and variables -> Actions,"
          echo "using a Cloudflare API token with 'Edit Cloudflare Workers' permissions."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run deploy` -> `wrangler deploy`; wrangler.jsonc's build.command
      # runs `npm run build` first, so the latest frontend always ships.
      # Output is teed to a file so the step below can surface the real
      # wrangler error as job annotations when the deploy fails.
      - name: Deploy
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee "$GITHUB_WORKSPACE/deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report deploy failure
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/deploy.log"
          echo "::error::Wrangler deploy failed — key error lines follow."
          if [ -f "$LOG" ]; then
            MATCHES=$(grep -E '✘|\[ERROR\]|APIError|Authentication|authentication|permission|not authorized|more than one account|CLOUDFLARE_ACCOUNT_ID|exited with|failed with' "$LOG" | tail -8 | cut -c1-170)
            if [ -n "$MATCHES" ]; then
              printf '%s\n' "$MATCHES" | while IFS= read -r line; do
                echo "::error::${line//%/?}"
              done
            else
              tail -6 "$LOG" | cut -c1-170 | while IFS= read -r line; do
                echo "::error::${line//%/?}"
              done
            fi
          else
            echo "::error::No deploy log captured; see the Deploy step output in the Actions UI."
          fi
