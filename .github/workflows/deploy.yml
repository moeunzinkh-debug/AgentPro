# Automatically deploys Agent Pro to Cloudflare Workers on every push to main.
#
# One-time setup (repo owner):
#   1. Create an API token: https://dash.cloudflare.com/profile/api-tokens
#      -> Create Token -> use the "Edit Cloudflare Workers" template.
#      Do NOT pick "Cloudflare Stream and Images" — that is for video/photos
#      and cannot deploy a Worker. Required permissions are:
#         Account | Workers Scripts  | Edit
#         Account | Account Settings | Read
#         User    | User Details     | Read
#   2. Add it as a repository secret:
#      Settings -> Secrets and variables -> Actions -> New repository secret
#         Name:  CLOUDFLARE_API_TOKEN
#   3. Also add CLOUDFLARE_ACCOUNT_ID (Workers & Pages overview, right sidebar).
#      Without it Wrangler tries to list accounts and fails if the token
#      cannot read Account Settings.
#
# Until the secret exists this workflow fails fast with a clear message
# instead of half-deploying.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::Secret CLOUDFLARE_API_TOKEN is not set."
          echo "::error::Add a Repository secret (not Environment) named exactly CLOUDFLARE_API_TOKEN."
          echo "Path: Settings -> Secrets and variables -> Actions -> Repository secrets."
          echo "Token must use the 'Edit Cloudflare Workers' template (not Stream and Images),"
          echo "with no Client IP Address Filtering, plus optional CLOUDFLARE_ACCOUNT_ID."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Wrangler (pinned in package-lock) requires Node.js >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run deploy` -> `wrangler deploy`; wrangler.jsonc's build.command
      # runs `npm run build` first, so the latest frontend always ships.
      # Output is teed to a file so the step below can surface the real
      # wrangler error as job annotations when the deploy fails.
      - name: Deploy
        id: wrangler
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee "$GITHUB_WORKSPACE/deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report deploy failure
        if: failure() && steps.wrangler.outcome == 'failure'
        run: |
          LOG="$GITHUB_WORKSPACE/deploy.log"
          PLAIN="$GITHUB_WORKSPACE/deploy.plain.log"
          echo "::error::Wrangler deploy failed — key error lines follow."
          if [ -f "$LOG" ]; then
            # Strip ANSI color codes so annotations are readable on mobile.
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' "$LOG" > "$PLAIN"
            MATCHES=$(grep -E '\[ERROR\]|APIError|Authentication error|incorrect permissions|not authorized|workers/services|CLOUDFLARE_ACCOUNT_ID|exited with|failed with' "$PLAIN" | tail -12)
            if [ -n "$MATCHES" ]; then
              printf '%s\n' "$MATCHES" | while IFS= read -r line; do
                echo "::error::${line//%/?}"
              done
            else
              tail -8 "$PLAIN" | while IFS= read -r line; do
                echo "::error::${line//%/?}"
              done
            fi
          else
            echo "::error::No deploy log captured; see the Deploy step output in the Actions UI."
          fi
          if [ -f "$PLAIN" ] && grep -qE 'retrieve account IDs|incorrect permissions|authentication may have expired|Authentication error|workers/services/.+failed' "$PLAIN"; then
            echo "::error::API token cannot deploy Workers (auth/permission error)."
            echo "::error::Recreate the token from the Edit Cloudflare Workers template — not Stream and Images."
            echo "::error::Needed: Account/Workers Scripts/Edit, Account/Account Settings/Read, User/User Details/Read."
            echo "::error::Do not set Client IP Address Filtering. Then replace GitHub secret CLOUDFLARE_API_TOKEN."
          fi
